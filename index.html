<!DOCTYPE html>
<!-- Big Ballers Dashboard | build r7 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Big Ballers 2026–27 | League Dashboard</title>
<meta name="theme-color" content="#0D1B31">
<meta name="description" content="Big Ballers fantasy football league: scores, standings, power rankings, lineup report and history.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2260%22%20height%3D%2260%22%20rx%3D%2215%22%20fill%3D%22%235F93DB%22/%3E%3Cg%20transform%3D%22rotate%28-30%2032%2032%29%22%3E%3Cpath%20d%3D%22M7%2032C15%2013%2049%2013%2057%2032C49%2051%2015%2051%207%2032Z%22%20fill%3D%22%23173561%22/%3E%3Cpath%20d%3D%22M23%2032H41M26%2028.4V35.6M29.3%2028.4V35.6M32.6%2028.4V35.6M35.9%2028.4V35.6M39%2028.4V35.6%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
--brand:#5F93DB; --brand-600:#4A7FCB; --brand-700:#3268B4; --brand-900:#173561; --brand-50:#EDF3FC; --brand-100:#DCE8F8;
--turf:#3268B4; --turf-2:#4A7FCB; --turf-3:#173561;
--chalk:#F5F8FC; --paper:#FFFFFF; --ink:#1A2433; --muted:#566377; --faint:#8C97A8;
--line:#DCE3EE; --line-2:#EBF0F7;
--yellow:#FF8A3D; --accent:#FF8A3D; --win:#1E8E5A; --loss:#D1453B; --amber:#B7791F;
--display:'Big Shoulders Display','Arial Narrow','Roboto Condensed',sans-serif;
--body:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--chalk);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
font-variant-numeric:tabular-nums;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
/* ---------- Header / field ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:0 20px;position:relative}
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:22px 0 14px;flex-wrap:wrap}
.wordmark{font-family:var(--display);font-weight:900;font-size:clamp(34px,6vw,52px);line-height:.9;letter-spacing:.5px}
.wordmark small{display:block;font-family:var(--body);font-weight:500;font-size:14px;letter-spacing:0;opacity:.75;margin-top:8px}
.asof{font-size:13px;opacity:.75;text-align:right}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
nav.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 14px 14px;font-weight:600;font-size:15px;white-space:nowrap;color:rgba(242,245,240,.72);position:relative}
.tab:hover{color:var(--chalk)}
.tab[aria-selected="true"]{color:var(--chalk)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:4px;background:var(--yellow)}
/* ---------- Hero (overview only) ---------- */
.kicker{font-weight:600;font-size:14px;color:var(--yellow);margin-bottom:10px}
/* ---------- Page scaffolding ---------- */
main.wrap{padding-top:36px;padding-bottom:56px}
.panel{display:none}
.panel.active{display:block}
h2{font-family:var(--display);font-weight:800;font-size:clamp(30px,4.2vw,42px);line-height:1;margin-bottom:6px}
h3{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.05}
.lede{color:var(--muted);max-width:68ch;margin-bottom:22px}
.section{margin-top:44px}
.section:first-child{margin-top:0}
.sub{font-size:14px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);max-width:75ch;margin-top:12px}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:36px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
/* ---------- Week switch ---------- */
.switch{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--paper);margin-bottom:20px}
.switch button{padding:8px 16px;font-weight:600;font-size:14px;color:var(--muted)}
.switch button[aria-pressed="true"]{background:var(--turf);color:var(--chalk)}
/* ---------- Results rows ---------- */
.results{border-top:2px solid var(--ink)}
.result{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:12px 0;border-bottom:1px solid var(--line)}
.result .tm{display:flex;align-items:baseline;gap:8px;min-width:0}
.result .tm span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result .sc{font-family:var(--display);font-weight:700;font-size:22px;text-align:right;line-height:1.2}
.result .lost{color:var(--muted)}
.result .won .n{font-weight:700}
.result .mgn{grid-column:1/-1;font-size:13px;color:var(--muted)}
/* ---------- Stories ---------- */
.stories{display:grid;gap:22px}
.story h3{font-size:22px;margin-bottom:4px}
.story p{max-width:64ch}
.story{padding-left:16px;border-left:4px solid var(--turf)}
/* ---------- Game cards (scores) ---------- */
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:860px){.games{grid-template-columns:1fr}}
.game{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px 18px 14px}
.line{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:6px 0}
.line+.line{border-top:1px solid var(--line-2)}
.line .who{min-width:0}
.line .who b{display:block;font-size:17px;line-height:1.2}
.line .who span{font-size:13px;color:var(--muted)}
.line .pts{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.line.l .pts,.line.l b{color:var(--muted)}
.line.w .pts{color:var(--ink)}
.wtag{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--win);margin-right:6px;vertical-align:middle}
.game .recap{font-size:15px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-2)}
.game .meta{font-size:13px;color:var(--muted);margin-top:8px}
details{margin-top:10px}
summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--turf);list-style:none;display:inline-flex;align-items:center;gap:6px}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";font-weight:700;width:14px;display:inline-block}
details[open] summary::before{content:"–"}
.game{container-type:inline-size}
.box{display:grid;grid-template-columns:1fr;gap:18px;margin-top:10px}
@container (min-width:680px){.box{grid-template-columns:1fr 1fr}}
.box h4{font-size:14px;margin-bottom:4px}
/* ---------- Tables ---------- */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{font-weight:600;font-size:12.5px;color:var(--muted);text-align:left;padding:8px 8px;border-bottom:2px solid var(--ink);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;white-space:nowrap}
tr.bench td{color:var(--muted)}
tr.bench td:first-child{font-style:normal}
.mini td,.mini th{padding:4px 6px;font-size:13px}
.mini th{border-bottom:1px solid var(--ink)}
.teamcell b{display:block;line-height:1.25}
.teamcell span{font-size:12.5px;color:var(--muted)}
tr.cut td{border-bottom:0}
tr.playoffline td{padding:0;border:0;height:22px;position:relative}
tr.playoffline td::before{content:"";position:absolute;left:0;right:0;top:9px;height:4px;background:var(--yellow)}
tr.playoffline td span{position:relative;background:var(--chalk);padding:0 8px 0 0;font-size:12px;font-weight:600;color:var(--ink);top:0}
.pos{color:var(--win);font-weight:600}.neg{color:var(--loss);font-weight:600}
.chip{display:inline-block;min-width:20px;text-align:center;font-size:12px;font-weight:700;border-radius:3px;padding:1px 4px;margin-right:2px;color:#fff}
.chip.W{background:var(--win)}.chip.L{background:var(--loss)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:3px;padding:0 4px;margin-left:5px;vertical-align:1px;border:1px solid currentColor}
.tag.Q,.tag.DTD{color:var(--amber)}.tag.D,.tag.O,.tag.IR,.tag.BYE{color:var(--loss)}
.pbar{height:8px;background:var(--line-2);border-radius:4px;overflow:hidden;min-width:80px}
.pbar i{display:block;height:100%;background:var(--turf)}
.dash{color:var(--faint)}
/* ---------- Power ---------- */
.power{list-style:none;border-top:2px solid var(--ink)}
.power li{display:grid;grid-template-columns:56px 1fr auto;gap:4px 16px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.power .rk{font-family:var(--display);font-weight:900;font-size:40px;line-height:.9}
.power .nm b{font-size:18px;display:block;line-height:1.2}
.power .nm span{font-size:13px;color:var(--muted)}
.power .nm p{margin-top:6px;max-width:64ch}
.power .st{text-align:right;font-size:13px;color:var(--muted);white-space:nowrap}
.power .st strong{display:block;font-family:var(--display);font-size:22px;color:var(--ink);font-weight:700}
.mv{font-weight:700;font-size:13px}
.mv.up{color:var(--win)}.mv.dn{color:var(--loss)}.mv.eq{color:var(--faint)}
@media (max-width:560px){.power li{grid-template-columns:44px 1fr}.power .st{grid-column:2;text-align:left}}
/* ---------- Decisive calls ---------- */
.calls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.calls{grid-template-columns:1fr}}
.call{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--loss);border-radius:6px;padding:14px 16px}
.call b{display:block;font-size:17px}
.call p{font-size:14.5px;margin-top:4px}
/* ---------- Preview ---------- */
.pv{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:18px}
.pv-head{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end}
.pv-head .r{text-align:right}
.pv-head b{display:block;font-size:17px;line-height:1.2}
.pv-head span{font-size:13px;color:var(--muted)}
.pv-head .proj{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;margin-top:4px}
.pv-at{font-family:var(--display);font-weight:700;font-size:20px;color:var(--faint);padding-bottom:4px}
.wp{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:12px 0 4px}
.wp i:first-child{background:var(--turf)}.wp i:last-child{background:#A9BCB0}
.wpl{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.pv p.w{margin:12px 0 4px;max-width:78ch}
.lu{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px}
@media (max-width:640px){.lu{grid-template-columns:1fr}.pv-head{grid-template-columns:1fr;}.pv-head .r{text-align:left}.pv-at{display:none}}
.benchnote{font-size:13px;color:var(--muted);margin-top:6px}
.alert{background:var(--turf);color:var(--chalk);border-radius:8px;padding:14px 18px;margin-bottom:22px;display:flex;gap:14px;align-items:flex-start}
.alert::before{content:"";flex:0 0 6px;align-self:stretch;background:var(--yellow);border-radius:2px}
/* ---------- History ---------- */
.champs{list-style:none;border-top:2px solid var(--ink)}
.champs li{display:grid;grid-template-columns:70px 1fr 1fr;gap:4px 18px;padding:12px 0;border-bottom:1px solid var(--line)}
.champs .yr{font-family:var(--display);font-weight:800;font-size:28px;line-height:1}
.champs .ch b{display:block;font-size:17px}
.champs .ch span,.champs .ru{font-size:13.5px;color:var(--muted)}
@media (max-width:640px){.champs li{grid-template-columns:60px 1fr}.champs .ru{grid-column:2}}
.records{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 28px}
@media (max-width:860px){.records{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.records{grid-template-columns:1fr}}
.rec .v{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.rec .k{font-weight:600;margin-top:6px}
.rec .d{font-size:14px;color:var(--muted)}
.aka{font-size:12.5px;color:var(--muted);max-width:46ch}
/* ---------- Game-flow chart ---------- */
.flow{margin-top:26px}
.flow svg{display:block;width:100%;height:auto;overflow:visible}
.flow .ax{font:600 12px var(--body);fill:rgba(242,245,240,.7)}
.flow .yl{font:500 11px var(--body);fill:rgba(242,245,240,.45)}
.flow .grid{stroke:rgba(255,255,255,.08);stroke-width:1}
.flow .gap{fill:rgba(255,255,255,.06)}
.flow .loser{fill:none;stroke:rgba(242,245,240,.5);stroke-width:3;stroke-linejoin:round}
.flow .winner{fill:none;stroke:#fff;stroke-width:4.5;stroke-linejoin:round;stroke-linecap:round}
.flow .dot-w{fill:#fff}.flow .dot-l{fill:rgba(242,245,240,.55)}
.flow .togain{stroke:var(--yellow);stroke-width:4}
.flow .tg-label{font:700 13px var(--body);fill:var(--yellow)}
.flow .dl{font:700 13px var(--display);fill:#fff;letter-spacing:.3px}
.flow .dl.big{font-size:22px}
.flow .legend{font:600 13px var(--body)}
@media (prefers-reduced-motion:no-preference){
.flow .winner.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.8s cubic-bezier(.6,.05,.3,1) .25s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
}
.beats{list-style:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin-top:18px;border-top:1px solid rgba(255,255,255,.15)}
.beats li{padding:12px 14px 4px 0;font-size:14px;color:rgba(242,245,240,.82)}
.beats li+li{padding-left:14px;border-left:1px solid rgba(255,255,255,.1)}
.beats b{display:block;font-family:var(--display);font-size:18px;color:var(--chalk);font-weight:800;letter-spacing:.2px}
.beats .st{display:block;font-weight:700;color:var(--chalk);margin-top:4px}
.beats .st.up{color:var(--yellow)}
@media (max-width:900px){.beats{grid-template-columns:1fr}.beats li+li{padding-left:0;border-left:0;border-top:1px solid rgba(255,255,255,.1)}}
.hero-grid{display:grid;grid-template-columns:1fr;gap:6px}
/* light version inside score cards */
.mflow{margin-top:12px}
.mflow svg{display:block;width:100%;height:auto;overflow:visible}
.mflow .ax{font:600 11px var(--body);fill:var(--muted)}
.mflow .grid{stroke:var(--line-2)}
.mflow .gap{fill:rgba(18,61,43,.06)}
.mflow .winner{fill:none;stroke:var(--turf);stroke-width:3;stroke-linejoin:round}
.mflow .loser{fill:none;stroke:#A5B4AA;stroke-width:2.5;stroke-linejoin:round}
.mflow .dot-w{fill:var(--turf)}.mflow .dot-l{fill:#A5B4AA}
.mflow .dl{font:700 11px var(--body);fill:var(--ink)}
.mflow .yl{display:none}
.flowcap{font-size:13px;color:var(--muted);margin-top:4px}
.upset{display:inline-block;font-size:11px;font-weight:700;color:var(--loss);border:1px solid currentColor;border-radius:3px;padding:0 5px;margin-left:6px;vertical-align:1px}
/* ---------- Insights ---------- */
.heat td.h{text-align:right;font-weight:600;white-space:nowrap}
.diverge{border-top:2px solid var(--ink)}
.dv{display:grid;grid-template-columns:minmax(150px,1.2fr) 2fr 70px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.dv .n b{display:block;font-size:14.5px;line-height:1.2}.dv .n span{font-size:12.5px;color:var(--muted)}
.dv .bar{position:relative;height:14px}
.dv .bar i{position:absolute;top:0;height:100%;border-radius:2px}
.dv .bar i{left:0}.dv .bar i.p{background:var(--win)}.dv .bar i.m{background:var(--loss)}
.dv .v{text-align:right;font-weight:700;font-size:14px;white-space:nowrap}
.dv .v small{display:block;font-weight:500;color:var(--muted);font-size:12px}
@media (max-width:560px){.dv{grid-template-columns:1fr 70px}.dv .bar{grid-column:1/-1;grid-row:2}}
.dv.wide{grid-template-columns:minmax(150px,1.2fr) 2fr 104px}
@media (max-width:560px){.dv.wide{grid-template-columns:1fr 104px}}
.bigstat{font-family:var(--display);font-weight:800;font-size:clamp(28px,4vw,40px);line-height:1}
.statrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 28px;margin:6px 0 20px}
@media (max-width:640px){.statrow{grid-template-columns:1fr}}
.statrow p{font-size:14px;color:var(--muted);margin-top:4px;max-width:34ch}
footer{border-top:1px solid var(--line);padding:22px 0 32px;font-size:13px;color:var(--muted)}
footer p{max-width:80ch;margin-bottom:6px}
@media (prefers-reduced-motion:no-preference){
.panel.active{animation:in .18s ease-out}
@keyframes in{from{opacity:.4}to{opacity:1}}
}
@media print{.field nav,.switch,summary{display:none}details>*{display:block}}
/* ================= Blue theme ================= */
body{background:var(--chalk)}
header.top{background:var(--brand);color:#fff}
header.top .masthead{padding:20px 20px 18px}
header.top .wordmark{color:#fff;text-shadow:0 1px 0 rgba(23,53,97,.25)}
header.top .wordmark small,header.top .asof{color:rgba(255,255,255,.92);opacity:1}
.tabbar{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;box-shadow:0 1px 0 rgba(23,53,97,.04)}
.tabbar .tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.tabbar .tabs::-webkit-scrollbar{display:none}
.tabbar .tab{color:var(--muted);padding:13px 12px 12px}
.tabbar .tab:hover{color:var(--ink)}
.tabbar .tab[aria-selected="true"]{color:var(--brand-700)}
.tabbar .tab[aria-selected="true"]::after{background:var(--brand);height:3px;left:8px;right:8px}
:focus-visible{outline:3px solid var(--accent)}
.kicker{color:var(--brand-700)}
.story{border-left-color:var(--brand)}
tr.playoffline td::before{background:var(--accent)}
.alert{background:var(--brand-900)}
.alert::before{background:var(--accent)}
.wp i:last-child{background:var(--brand-100)}
.pv-at{color:var(--brand)}
/* Week in review */
.daily{background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--brand);border-radius:10px;padding:16px 18px 12px;margin:0 0 26px}
.daily .dh{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 14px;margin-bottom:8px}
.daily h2{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;margin:0}
.daily .dd{font-size:13px;color:var(--muted)}
.daily ul{list-style:none;margin:0;padding:0}
.daily li{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line-2);font-size:15px;line-height:1.45}
.daily .lv{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:3px 0;text-align:center;align-self:start;color:#fff;background:var(--brand-700)}
.daily .lv.out{background:var(--loss)}
.daily .lv.watch{background:var(--accent);color:#0A1629}
.daily .lv.info{background:var(--brand);color:#0A1629}
.daily .tm{font-weight:700}
.wir{padding:8px 0 4px}
.wir h1{font-family:var(--display);font-weight:800;font-size:clamp(36px,5.6vw,64px);line-height:.98;max-width:22ch;margin:6px 0 14px}
.wir .deck{font-size:18px;max-width:70ch;color:#2B3748}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:24px 0 8px}
@media (max-width:860px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;border-top:4px solid var(--brand)}
.tile .v{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.tile .k{font-weight:600;font-size:14px;margin-top:6px}
.tile .d{font-size:13px;color:var(--muted)}
.tile .d .dn{color:var(--loss);font-weight:700}.tile .d .upc{color:var(--win);font-weight:700}
.panelbox{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.cx .ax{font:600 12px var(--body);fill:var(--muted)}
.cx .lab{font:600 12px var(--body);fill:var(--ink)}
.cx .labm{font:500 11.5px var(--body);fill:var(--muted)}
.cx .grid{stroke:var(--line-2)}
.cx .dot{fill:var(--brand);stroke:#fff;stroke-width:1.5}
.cx .dot.hi{fill:var(--brand-900)}.cx .dot.lo{fill:var(--accent)}
.cx .med{stroke:var(--ink);stroke-width:2}
.cx .avg{stroke:var(--accent);stroke-width:2;stroke-dasharray:4 3}
.cx .bar-p{fill:var(--brand-100)}.cx .bar-a{fill:var(--brand)}.cx .bar-a.neg{fill:var(--accent)}
.takeaways{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:6px}
@media (max-width:860px){.takeaways{grid-template-columns:1fr}}
.take{border-left:4px solid var(--brand);padding:2px 0 2px 14px}
.take b{display:block;font-family:var(--display);font-size:22px;line-height:1.05;margin-bottom:4px}
.take p{font-size:14.5px;color:#2B3748}
.inj{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.inj{grid-template-columns:1fr}}
.injcard{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.injcard.start{border-left:4px solid var(--accent)}
.injcard .pos{grid-row:1/3;width:40px;height:40px;border-radius:8px;background:var(--brand-50);color:var(--brand-700);display:grid;place-items:center;font:800 14px var(--display);letter-spacing:.3px}
.injcard b{font-size:15.5px;line-height:1.25}
.injcard .own{font-size:12.5px;color:var(--muted)}
.injcard p{grid-column:2;font-size:14px;color:#2B3748;margin-top:2px}
.role{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.role.Starting{background:#FFE7D6;color:#A6470F}.role.Bench{background:var(--line-2);color:var(--muted)}.role.IR{background:var(--line-2);color:var(--muted)}
.srcs{font-size:12.5px;color:var(--muted);margin-top:10px}
.srcs a{color:var(--brand-700)}
.alerts{list-style:none}
.alerts li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.alerts li b{display:block}
.hbar{display:grid;grid-template-columns:minmax(120px,1.1fr) 2fr 56px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-2)}
.hbar .n b{display:block;font-size:14.5px;line-height:1.2}.hbar .n span{font-size:12.5px;color:var(--muted)}
.hbar .t{height:12px;background:var(--brand-50);border-radius:6px;overflow:hidden}.hbar .t i{display:block;height:100%;background:var(--brand);border-radius:6px}
.hbar .v{text-align:right;font-weight:700}
/* Storylines feature */
.feature{background:var(--brand-900);color:#F5F8FC;border-radius:14px;padding:26px 26px 18px;margin-bottom:34px}
.feature .kicker{color:var(--accent)}
.feature h2{color:#fff;font-size:clamp(32px,4.6vw,54px);max-width:20ch}
.feature p.deck{max-width:70ch;color:rgba(245,248,252,.86);font-size:17px;margin-top:10px}
.flow .winner{stroke:#fff}.flow .togain{stroke:var(--accent)}.flow .tg-label{fill:var(--accent)}
.beats .st.up{color:var(--accent)}
.mflow .winner{stroke:var(--brand-700)}.mflow .dot-w{fill:var(--brand-700)}.mflow .loser{stroke:#AAB6C8}.mflow .dot-l{fill:#AAB6C8}.mflow .gap{fill:rgba(95,147,219,.10)}
.switch button[aria-pressed="true"]{background:var(--brand-700)}
summary{color:var(--brand-700)}
/* ================= Brand system (final pass) ================= */
header.top{background:var(--brand);position:relative;overflow:hidden}
header.top::after{content:"";position:absolute;right:-120px;top:-160px;width:520px;height:520px;border-radius:50%;
background:radial-gradient(closest-side,rgba(255,255,255,.16),rgba(255,255,255,0));pointer-events:none}
header.top .masthead{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 20px;flex-wrap:wrap;position:relative;z-index:1}
.lockup{display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff}
.mark{display:inline-block;width:62px;height:62px;flex:0 0 auto;filter:drop-shadow(0 3px 6px rgba(15,39,72,.28))}
.mark svg{width:100%;height:100%;display:block}
.mark.sm{width:34px;height:34px;filter:none}
.lt{display:flex;flex-direction:column;line-height:1}
.wm{font-family:var(--display);font-weight:900;font-size:clamp(34px,5vw,48px);letter-spacing:.5px;text-transform:uppercase;
display:inline-block;transform:skewX(-7deg);transform-origin:left bottom;text-shadow:0 2px 0 rgba(15,39,72,.25)}
.tagline{display:flex;align-items:center;gap:10px;margin-top:7px;font-weight:700;font-size:13.5px;color:#0F2748;letter-spacing:.2px}
.est{display:inline-block;border:1.5px solid #0F2748;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700}
.season{background:rgba(255,255,255,.96);color:var(--ink);border-radius:12px;padding:10px 14px 11px;min-width:250px;box-shadow:0 6px 18px rgba(15,39,72,.18)}
.season .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.season .wk{font-family:var(--display);font-weight:800;font-size:24px;line-height:1}
.season .yr{font-size:12.5px;font-weight:600;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(17,1fr);gap:3px;margin:9px 0 6px}
.seg i{height:7px;border-radius:2px;background:var(--brand-100)}
.seg i.done{background:var(--brand-700)}
.seg i.po{background:#FFE2CC}
.seg i.po.first{margin-left:5px}
.season .cap{display:flex;justify-content:space-between;gap:14px;font-size:11.5px;color:var(--muted)}
@media (max-width:640px){.season{width:100%;min-width:0}.mark{width:52px;height:52px}}
.footgrid{display:flex;gap:14px;align-items:flex-start}
/* Team badges */
.av{--c:var(--brand-700);display:inline-grid;place-items:center;flex:0 0 auto;min-width:30px;height:30px;padding:0 5px;border-radius:8px;
background:var(--c);color:#fff;font:800 13px/1 var(--display);letter-spacing:.4px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.av.s{min-width:24px;height:24px;font-size:11px;border-radius:6px;padding:0 4px}
.av.l{min-width:40px;height:40px;font-size:16px;border-radius:10px}
.teamcell{display:flex;align-items:center;gap:10px}
.teamcell .tx{min-width:0}
.line .who{display:flex;align-items:center;gap:10px}
.line .who .tx{min-width:0}
.power li{grid-template-columns:56px 44px 1fr auto}
@media (max-width:560px){.power li{grid-template-columns:40px 40px 1fr}.power .st{grid-column:3}}
.mini .nm{display:flex;align-items:center;gap:8px}
/* Chart polish */
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.cx .val{font:700 11.5px var(--body);fill:var(--ink)}
.panelbox{box-shadow:0 1px 2px rgba(15,39,72,.04)}
.game,.pv,.tile,.injcard,.panelbox{transition:box-shadow .15s}
h2{letter-spacing:.2px}
.tile{border-top-width:0;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--brand)}
.tile:nth-child(2)::before{background:var(--brand-900)}.tile:nth-child(3)::before{background:var(--accent)}.tile:nth-child(4)::before{background:var(--brand-600)}
.pv-head b .av{vertical-align:-6px}
.who b .wtag{vertical-align:2px}
.tagline,.est{white-space:nowrap}
@media (max-width:640px){.tagline{font-size:12px;gap:7px}.est{font-size:11px;padding:0 7px}.lockup{gap:11px}}
span.av{color:#fff !important;font-size:13px !important;line-height:1 !important}
span.av.s{font-size:11px !important}
span.av.l{font-size:16px !important}
/* ================= Round 5: map, scoreboard, team reports ================= */
.mapgrid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:980px){.mapgrid{grid-template-columns:1fr}}
.mapwrap{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 14px 8px}
.map{position:relative;height:480px;border-radius:10px;overflow:hidden;background:#FBFCFE}
@media (max-width:640px){.map{height:400px}}
.map .q{position:absolute}
.map .q span{position:absolute;font:800 15px/1 var(--display);letter-spacing:.4px;text-transform:uppercase;opacity:.9;padding:10px 12px}
.q-tl{background:#FDF0EF}.q-tl span{left:0;top:0;color:#B23A31}
.q-tr{background:#FFF4EA}.q-tr span{right:0;top:0;color:#B8601E}
.q-bl{background:#F2F5F9}.q-bl span{left:0;bottom:0;color:#6A778A}
.q-br{background:#EAF2FC}.q-br span{right:0;bottom:0;color:var(--brand-700)}
.avgx{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed rgba(26,36,51,.25)}
.avgy{position:absolute;left:0;right:0;height:0;border-top:2px dashed rgba(26,36,51,.25)}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px;border-radius:12px;cursor:pointer;transition:transform .15s}
.pin .av{min-width:36px;height:36px;font-size:14px !important;border-radius:10px;box-shadow:0 2px 6px rgba(15,39,72,.25),inset 0 -2px 0 rgba(0,0,0,.15);transition:box-shadow .15s}
.pin .rec{font:700 11.5px var(--body);color:var(--ink);background:rgba(255,255,255,.9);border-radius:6px;padding:0 5px}
.pin:hover{transform:translate(-50%,-50%) scale(1.08);z-index:3}
.pin.on{z-index:4}.pin.on .av{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ink),0 6px 14px rgba(15,39,72,.3)}
.mapaxes{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--muted);padding:8px 4px 2px}
.mappanel .treport{margin:0}
.sb{display:grid;gap:6px}
.sbr{display:grid;grid-template-columns:22px 26px minmax(0,190px) 1fr 62px 26px;gap:10px;align-items:center}
@media (max-width:640px){.sbr{grid-template-columns:18px 26px minmax(0,1fr) 58px 24px}.sbr .track{grid-column:2/-1;grid-row:2}}
.sbr .rk{font:800 15px var(--display);color:var(--faint);text-align:right}
.sbr .nm{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbr .track{position:relative;height:18px;background:var(--line-2);border-radius:5px}
.sbr .track i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:#B7C3D4}
.sbr .track i.w{background:var(--brand)}
.sbr .track em{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;background:var(--ink);border-radius:2px}
.sbr b{text-align:right;font-family:var(--display);font-size:19px}
.pr-rows{display:grid;gap:12px}
.prr{display:grid;grid-template-columns:48px 1fr 190px 64px;gap:12px;align-items:center}
@media (max-width:640px){.prr{grid-template-columns:44px 1fr 60px}.prr .pv{grid-column:2/3;grid-row:2;font-size:12.5px}}
.prr .pk{font:800 18px var(--display);color:var(--ink)}
.ptrack{position:relative;height:22px;background:var(--line-2);border-radius:6px}
.ptrack i{position:absolute;left:0;top:0;bottom:0;background:var(--brand);border-radius:6px}
.ptrack i.neg{background:var(--accent)}
.ptrack em{position:absolute;top:-5px;bottom:-5px;width:4px;margin-left:-2px;background:var(--ink);border-radius:2px}
.prr .pv{font-size:13.5px;color:var(--muted)}.prr .pv b{color:var(--ink);font-size:15px}
.prr .pd{text-align:right;font-weight:800;font-family:var(--display);font-size:18px}
.pd.neg{color:var(--loss)}.pd.pos{color:var(--win)}
/* Team report card */
.treports{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:900px){.treports{grid-template-columns:1fr}}
.treport{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;position:relative;overflow:hidden;scroll-margin-top:64px}
.treport::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--c)}
.tr-h{display:flex;align-items:center;gap:12px}
.tr-h .tx{flex:1;min-width:0}.tr-h .tx b{display:block;font-size:18px;line-height:1.2}.tr-h .tx span{font-size:13px;color:var(--muted)}
.grade{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:900 24px var(--display);color:#fff;flex:0 0 auto}
.g-A{background:var(--brand-700)}.g-B{background:var(--brand)}.g-C{background:var(--amber)}.g-D,.g-F{background:var(--loss)}
.tr-t{font-size:26px;margin:14px 0 6px;line-height:1.05}
.tr-b{font-size:15px;color:#2B3748}
.tr-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0;background:var(--brand-50);border-radius:10px;padding:10px}
@media (max-width:520px){.tr-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tr-stats b{display:block;font:800 20px var(--display)}.tr-stats span{font-size:11.5px;color:var(--muted)}
.tr-pos{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.tr-pos .lbl{font-size:12px;font-weight:600;color:var(--muted);margin-right:4px}
.pr{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--line-2);color:var(--muted)}
.pr b{color:var(--ink)}
.pr.top{background:#DDF3E7;color:#17663F}.pr.top b{color:#0F4F30}
.pr.bot{background:#FDE3E0;color:#9E2F27}.pr.bot b{color:#7A221B}
.tr-wb{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.tr-wb{grid-template-columns:1fr}}
.tr-wb h4{font:800 14px var(--display);letter-spacing:.4px;text-transform:uppercase;margin-bottom:2px}
.tr-wb .ok h4{color:var(--win)}.tr-wb .bad h4{color:var(--loss)}
.tr-wb p{font-size:14px}
.tr-call{display:grid;grid-template-columns:auto 1fr 90px 42px;gap:8px 10px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.tr-call .wk{font:800 13px var(--display);letter-spacing:.4px;text-transform:uppercase;color:var(--brand-700)}
.tr-call .vs{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;min-width:0}
.tr-call .odds{height:8px;background:var(--line-2);border-radius:4px;overflow:hidden}.tr-call .odds i{display:block;height:100%;background:var(--brand)}
.tr-call b{text-align:right}
.tr-call p{grid-column:1/-1;font-size:14px;color:#2B3748}
.tr-inj{font-size:13px;color:var(--muted);margin-top:8px}
.jump{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.jb{padding:0;border-radius:9px;transition:transform .12s}.jb:hover{transform:translateY(-2px)}
.sbr{grid-template-columns:22px auto minmax(0,190px) 1fr 62px 26px}
@media (max-width:640px){.sbr{grid-template-columns:18px auto minmax(0,1fr) 58px 24px}
.pin .av{min-width:30px;height:30px;font-size:12px !important;border-radius:8px}.pin .rec{font-size:10.5px}
.map .q span{font-size:11.5px;padding:7px 8px}}
@media (max-width:640px){.mapaxes{font-size:11px}.mapaxes span:nth-child(2){display:none}}
/* ================= Night-game theme (r7) ================= */
:root{
--bg:#0D1B31; --panel:#142948; --panel-2:#1A3358; --paper:#142948; --chalk:#0D1B31;
--ink:#EAF1FB; --ink-2:#C6D4E9; --muted:#95A9C6; --faint:#6E84A6;
--line:#28466F; --line-2:#1E3A60;
--brand:#5F93DB; --brand-600:#7AA7E5; --brand-700:#8DB6EC; --brand-900:#0A1629; --brand-50:#1B3861; --brand-100:#2B4C7C;
--turf:#5F93DB; --accent:#FF9B55; --yellow:#FF9B55;
--win:#43CF8F; --loss:#FF6F66; --amber:#F2B441;
}
html,body{background:var(--bg)}
body{color:var(--ink)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
background:radial-gradient(1100px 520px at 85% -8%,rgba(95,147,219,.22),transparent 60%),radial-gradient(900px 480px at -10% 30%,rgba(95,147,219,.10),transparent 60%)}
/* headings: broadcast style */
h2{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--ink);
display:flex;align-items:center;gap:12px}
h2::before{content:"";width:6px;height:.9em;border-radius:2px;background:var(--brand);flex:0 0 auto}
.feature h2,.wir h1{text-transform:none;letter-spacing:.2px}
.feature h2::before{display:none}
h3{color:var(--ink);letter-spacing:.3px}
.kicker{color:var(--brand-700);text-transform:uppercase;letter-spacing:1.4px;font-size:13px;font-weight:700}
.lede,.sub,.note{color:var(--muted)}
.lede b,.note b{color:var(--ink-2)}
/* header + nav */
header.top{background:linear-gradient(120deg,#5F93DB 0%,#4F86D4 55%,#3F74C4 100%)}
header.top::after{background:radial-gradient(closest-side,rgba(255,255,255,.22),rgba(255,255,255,0))}
.tabbar{background:#0A1629;border-bottom:1px solid #1E3A60;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.tabbar .tab{color:#9FB3CF;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.6px;text-transform:uppercase;padding:14px 12px 13px}
.tabbar .tab:hover{color:#EAF1FB}
.tabbar .tab[aria-selected="true"]{color:#FFFFFF}
.tabbar .tab[aria-selected="true"]::after{background:var(--brand);height:4px}
.season{background:rgba(10,22,41,.72);color:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(6px)}
.season .wk{text-transform:uppercase;letter-spacing:.6px}
.season .yr,.season .cap{color:#AFC3DF}
.seg i{background:rgba(255,255,255,.14)}.seg i.done{background:var(--brand)}.seg i.po{background:rgba(255,155,85,.35)}
.tagline{color:#0A1629}.est{border-color:#0A1629}
.mark{filter:drop-shadow(0 4px 10px rgba(10,22,41,.45))}
/* surfaces */
.panelbox,.game,.pv,.tile,.injcard,.treport,.call,.mapwrap,.season-card{background:var(--panel);border-color:var(--line)}
.daily{background:var(--panel);border-color:var(--line);border-left-color:var(--brand)}.daily li{border-top-color:var(--line)}
.switch{background:var(--panel);border-color:var(--line);flex-wrap:wrap;max-width:100%}
.switch button.season{border-left:1px solid var(--line)}
.switch button{color:var(--muted)}
.switch button[aria-pressed="true"]{background:var(--brand);color:#0A1629}
.tile .v{color:var(--ink)}.tile .k{color:var(--ink-2)}
.wir .deck,.take p,.injcard p,.tr-b,.tr-call p,.tr-wb p,.game .recap,.story p,.pv p.w,.power .nm p,.call p{color:var(--ink-2)}
.game .recap{border-top-color:var(--line-2)}
.line+.line{border-top-color:var(--line-2)}
.line.w .pts{color:var(--ink)}
.chip.W{background:#1F9D63;color:#fff}.chip.L{background:#D8483E;color:#fff}
.pos{color:var(--win)}.neg{color:var(--loss)}
th{color:var(--muted);border-bottom:2px solid var(--brand)}
.mini th{border-bottom:1px solid var(--line)}
td{border-bottom-color:var(--line)}
.results,.power,.champs,.diverge{border-top-color:var(--brand)}
tr.playoffline td span{background:var(--bg);color:var(--accent)}
.alert{background:linear-gradient(120deg,#1B3F75,#122C54);border:1px solid var(--line)}
.story{border-left-color:var(--brand)}
.take{border-left-color:var(--brand)}
.pbar,.hbar .t,.tr-call .odds{background:var(--line-2)}
.wp i:last-child{background:#34557F}
summary{color:var(--brand-700)}
.srcs a{color:var(--brand-700)}
/* feature */
.feature{background:linear-gradient(135deg,#2E62AE 0%,#1D457F 60%,#15345F 100%);border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 40px rgba(0,0,0,.3)}
/* mini flow charts */
.mflow .ax{fill:var(--muted)}.mflow .grid{stroke:var(--line-2)}
.mflow .winner{stroke:var(--brand)}.mflow .dot-w{fill:var(--brand)}
.mflow .loser{stroke:#6E84A6}.mflow .dot-l{fill:#6E84A6}
.mflow .gap{fill:rgba(95,147,219,.14)}.mflow .dl{fill:var(--ink)}
/* map */
.map{background:var(--panel-2)}
.q-tl{background:rgba(255,111,102,.06)}.q-tl span{color:#FF9990}
.q-tr{background:rgba(255,155,85,.06)}.q-tr span{color:#FFB47E}
.q-bl{background:rgba(149,169,198,.06)}.q-bl span{color:#95A9C6}

C Concepcion and DK Metcalf (Steelers bye) for Michael Penix Jr. The Giants D/ST (11.68) starts at Philadelphia over the Lions' 9.44; the Bills D/ST (11.10) sits on the bench. ESPN now: 121.98 to 110.37. Estimate: 70% Bonifield.",

<div class="scroll"><table><thead><tr><th class="num">Claim</th><th>Team</th><th>Hole</th><th>Why</th></tr></thead><tbody>
${DATA.preview.waiverOrder.map((id, i) => `<tr><td class="num">${i + 1}</td><td>${teamCell(id)}</td><td>${need[id] ? `<b>${esc(need[id][1])}</b>` : '<span class="sub">None</span>'}</td><td class="sub">${need[id] ? esc(need[id][2]) : ''}</td></tr>`).join('')}
</tbody></table></div>
${DATA.preview.availableBy === 'owned' ? `<p class="note">Best available by ESPN ownership (% of ESPN leagues rostering him; ESPN's free-agent projections aren't in the data feed): ${DATA.preview.available.map(p => `${esc(p[0])}, ${esc(p[1])} ${esc(p[2])}, ${Number(p[3]).toFixed(1)}%${p[4] ? ` (${esc(p[4])})` : ''}`).join('; ')}.</p>` : `<p class="note">Best available by ESPN's Week ${NEXT} projection (average ESPN rank at the position in parentheses): ${DATA.preview.available.map(p => `${esc(p[0])}, ${esc(p[1])} ${esc(p[2])}, ${Number(p[3]).toFixed(2)} (${p[4]})`).join('; ')}.</p>`}
</div>`; })() : ''}
${DATA.preview.byes ? (() => { const wks = Object.keys(DATA.preview.byes).map(Number), rows = [];
DATA.preview.games.forEach(g => [g.away, g.home].forEach(id => rows.push({ id, by: wks.map(w => g.lineups[id].filter(p => DATA.preview.byes[w].includes(p[2]))) })));
rows.sort((x, y) => y.by.reduce((s, b) => s + b.length, 0) - x.by.reduce((s, b) => s + b.length, 0));
return `<div class="section"><h3 style="margin-bottom:6px">Bye-Week Crunch, Weeks ${wks[0]}–${wks[wks.length - 1]}</h3>
<p class="lede" style="margin-bottom:10px">Players in each team's current Week ${NEXT} lineup whose NFL team is on bye. Byes: ${wks.map(w => `Week ${w} ${DATA.preview.byes[w].join(', ')}`).join('; ')}.</p>
<div class="scroll"><table><thead><tr><th>Team</th>${wks.map(w => `<th>Week ${w}</th>`).join('')}<th class="num">Total</th></tr></thead><tbody>
${rows.map(r => `<tr><td>${teamCell(r.id)}</td>${r.by.map(b => `<td class="sub">${b.length ? b.map(p => `${esc(p[1])} (${esc(p[0])})`).join(', ') : '—'}</td>`).join('')}<td class="num">${r.by.reduce((s, b) => s + b.length, 0)}</td></tr>`).join('')}
</tbody></table></div></div>`; })() : ''}
${DATA.preview.games.map((g, i) => {
const a = g.away, h = g.home;
const bn = id => (DATA.preview.benchNotes[id] || []).length ? `<p class="benchnote">On the bench: ${DATA.preview.benchNotes[id].map(esc).join('; ')}.</p>` : '';
return `<article class="pv">
<div class="pv-head">
<div><b>${av(a, 's')} ${esc(T(a).name)}</b><span>${esc(T(a).manager)}, ${st[a].W}-${st[a].L}, ${st[a].ppg.toFixed(2)} per game</span><div class="proj">${g.proj[0].toFixed(1)}</div><span>projected</span></div>
<div class="pv-at">at</div>
<div class="r"><b>${esc(T(h).name)} ${av(h, 's')}</b><span>${esc(T(h).manager)}, ${st[h].W}-${st[h].L}, ${st[h].ppg.toFixed(2)} per game</span><div class="proj">${g.proj[1].toFixed(1)}</div><span>projected</span></div>
</div>
<div class="wp" role="img" aria-label="Win chance ${g.win[0]}% to ${g.win[1]}%"><i style="width:${g.win[0]}%"></i><i style="width:${g.win[1]}%"></i></div>
<div class="wpl"><span>${g.win[0]}%</span><span>${g.win[1]}%</span></div>
<p class="w">${esc(DATA.copy.preview[i] || '')}</p>
<details><summary>Lineups</summary><div class="lu">
<div><h4>${esc(T(a).name)}</h4>${luTable(g.lineups[a])}${bn(a)}</div>
<div><h4>${esc(T(h).name)}</h4>${luTable(g.lineups[h])}${bn(h)}</div>
</div></details>
</article>`;
}).join('')}`;
}
/* ---------- History ---------- */
function renderHistory() {
const H = DATA.history;
const mgr = H.managers.slice().sort((a, b) => {
const pa = (a[2] + a[3]) ? a[2] / (a[2] + a[3]) : -1, pb = (b[2] + b[3]) ? b[2] / (b[2] + b[3]) : -1;
return b[4] - a[4] || pb - pa;
});
const titles = {}; H.seasons.forEach(s => titles[s.champ[0]] = (titles[s.champ[0]] || []).concat(s.year));
$('history').innerHTML = `
<h2>Record Book</h2>
<p class="lede">Every champion since ${L.founded}, and how the current twelve have done. From ESPN's league history pages. Records are regular season; seasons were 13 games through 2020 and 14 since.</p>
<div class="grid2">
<div class="section">
<h3 style="margin-bottom:10px">Champions</h3>
<ol class="champs" reversed>${H.seasons.slice().reverse().map(s => `<li><div class="yr">${s.year}</div>
<div class="ch"><b>${esc(s.champ[0])}</b><span>${esc(s.champ[1])}</span></div>
<div class="ru">Runner-up: ${esc(s.second[0])} (${esc(s.second[1])})<br>Third: ${esc(s.third[0])} (${esc(s.third[1])})</div></li>`).join('')}</ol>
</div>
<div class="section">
<h3 style="margin-bottom:10px">Title Count</h3>
<table class="mini"><tbody>${Object.entries(titles).sort((a, b) => b[1].length - a[1].length || a[1][0] - b[1][0]).map(([n, ys]) =>
`<tr><td><b>${esc(n)}</b></td><td class="num">${'🏆'.repeat(ys.length)}</td><td class="num">${ys.join(', ')}</td></tr>`).join('')}</tbody></table>
<p class="note">Keith Gardiner and Mike Anderson are no longer in the league.</p>
</div>
</div>
<div class="section">
<h3 style="margin-bottom:10px">This Year's Managers, All-Time</h3>
<div class="scroll"><table>
<thead><tr><th>Manager</th><th class="num">Seasons</th><th class="num">Record</th><th class="num">Win %</th><th class="num">Titles</th><th class="num">Top-3 Finishes</th><th>Past Team Names</th></tr></thead>
<tbody>${mgr.map(m => `<tr><td><b>${esc(m[0])}</b></td><td class="num">${m[1] || 'Rookie'}</td>
<td class="num">${m[1] ? `${m[2]}-${m[3]}` : '—'}</td><td class="num">${m[1] ? pct(m[2] / (m[2] + m[3])) : '—'}</td>
<td class="num">${m[4] || ''}</td><td class="num">${m[5] || ''}</td><td class="aka">${m[6].map(esc).join('; ') || 'First season'}</td></tr>`).join('')}</tbody>
</table></div>
</div>
<div class="section">
<h3 style="margin-bottom:14px">League Records</h3>
<div class="records">${H.records.map(r => `<div class="rec"><div class="v">${esc(r[1])}</div><div class="k">${esc(r[0])}</div><div class="d">${esc(r[2])}</div></div>`).join('')}</div>
<p class="note">Single-week records are regular season, 2017 through 2025.</p>
</div>
${H.startOdds ? (() => { const so = H.startOdds, st = standings(so.asOf); return `<div class="section">
<h3 style="margin-bottom:6px">What Your Week ${so.asOf} Record Is Worth</h3>
<p class="lede" style="margin-bottom:12px">How often teams with each record after Week ${so.asOf} made the playoffs, ${esc(so.seasons)} (the six-team playoff era).</p>
<div class="scroll"><table><thead><tr><th>Record</th><th class="num">Made Playoffs</th><th style="min-width:120px">Rate</th><th>This Year</th><th>Notes</th></tr></thead><tbody>
${so.rows.map(r => { const now = st.filter(t => `${t.W}-${t.L}` === r[0]); return `<tr><td><b>${esc(r[0])}</b></td><td class="num">${r[1]} of ${r[2]}</td>
<td><div class="pbar"><i style="width:${(100 * r[1] / r[2]).toFixed(1)}%"></i></div><span class="sub">${Math.round(100 * r[1] / r[2])}%</span></td>
<td>${now.length ? now.map(t => esc(T(t.id).name)).join(', ') : '<span class="sub">None</span>'}</td><td class="sub">${esc(r[3])}</td></tr>`; }).join('')}
</tbody></table></div></div>`; })() : ''}`;
}
/* ---------- Footer ---------- */
function renderFooter() {
$('foot').innerHTML = `<p><b style="color:var(--ink)">Big Ballers Fantasy Football League</b>, est. ${L.founded}. ${esc(L.scoring)}, ${L.playoffTeams}-team playoff. Trade deadline ${esc(L.tradeDeadline)}.</p>
<p>Updated ${esc(L.updated)}.</p>`;
}
/* ---------- Tabs & routing ---------- */
const TABS = ['overview', 'scores', 'storylines', 'teams', 'standings', 'power', 'insights', 'preview', 'history'];
function show(tab, push) {
if (!TABS.includes(tab)) tab = 'overview';
document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === tab));
if (push) { try { history.replaceState(null, '', '#' + tab); } catch (e) { /* sandboxed previews block this; tabs still work */ } }
try { window.scrollTo(0, 0); } catch (e) {}
document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === tab));
if (tab === 'scores') drawMiniCharts();
if (tab === 'overview') drawOverviewCharts();
if (tab === 'storylines') { drawHeroChart(!state.drawn); state.drawn = true; }
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => show(b.dataset.tab, true)));
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { safe(() => drawHeroChart(false), 'storylines'); safe(drawMiniCharts, 'scores'); safe(drawOverviewCharts, 'overview'); }, 150); });
function safe(fn, panelId) {
try { fn(); }
catch (e) {
console.error(e);
const el = $(panelId);
if (el) el.innerHTML = `<p class="note">This section couldn't be drawn (${esc(e.message)}). The rest of the page is unaffected.</p>`;
}
}
document.addEventListener('click', e => {
const b = e.target.closest('.switch button'); if (!b) return;
state[b.dataset.key] = Number(b.dataset.w);
if (b.dataset.key === 'scoresWeek') safe(renderScores, 'scores'); else safe(renderInsights, 'insights');
});
safe(renderBrand, 'season');
$('previewTab').textContent = `Week ${NEXT}`;
let startTab = 'overview';
try { startTab = location.hash.slice(1) || 'overview'; } catch (e) {}
show(startTab);
[['overview', renderOverview], ['scores', renderScores], ['storylines', renderStorylines], ['teams', renderTeams], ['standings', renderStandings], ['power', renderPower],
['insights', renderInsights], ['preview', renderPreview], ['history', renderHistory], ['foot', renderFooter]].forEach(([id, fn]) => safe(fn, id));
show(startTab);
</script>
</body>
</html>
